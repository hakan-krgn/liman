<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Liman app icon: a terminal prompt resting on harbour water. 824px tile on a 1024 canvas (macOS grid). -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7C86FF"/>
      <stop offset="0.55" stop-color="#5B5FEF"/>
      <stop offset="1" stop-color="#3D3BC4"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#C9CCFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14124A" flood-opacity="0.35"/>
    </filter>
    <filter id="glyph" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1B1870" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <!-- soft top highlight -->
    <ellipse cx="512" cy="150" rx="560" ry="330" fill="url(#shine)"/>
    <!-- deep water band at the bottom -->
    <path d="M100 760 C 230 715, 330 715, 460 760 S 690 805, 820 760 S 924 730, 924 730 L 924 924 L 100 924 Z" fill="#2E2BA6" opacity="0.45"/>
  </g>

  <g filter="url(#glyph)" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(-27 6)">
    <!-- prompt chevron -->
    <path d="M318 352 L478 482 L318 612" stroke="#FFFFFF" stroke-width="74"/>
    <!-- harbour wave, doubling as the prompt's cursor line -->
    <path d="M520 612 C 560 578, 600 578, 640 612 S 720 646, 760 612" stroke="url(#water)" stroke-width="64"/>
  </g>
</svg>
