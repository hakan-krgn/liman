appId: com.uxplima.liman
productName: Liman
copyright: Copyright © 2026 Ahmet Hakan Kargın
# Where the in-app updater looks for new versions. Uploading is done by the
# release workflow (electron-builder itself always runs with --publish never).
publish:
  provider: github
  owner: hakan-krgn
  repo: liman
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # node-pty only needs lib/ and its prebuilt binaries at runtime.
  - "!node_modules/node-pty/{src,deps,scripts,third_party,typings,build}/**"
  - "!node_modules/node-pty/**/*.pdb"
# The renderer is fully bundled by Vite; ssh2 and node-pty ship as runtime
# dependencies. ssh2 falls back to pure JS without its optional native addon;
# node-pty brings prebuilt Node-API binaries that need no rebuild for Electron.
npmRebuild: false
asarUnpack:
  - "**/*.node"
  # Local terminals: ConPTY (conpty.dll, OpenConsole.exe) and macOS's spawn-helper run from disk.
  - "node_modules/node-pty/**"
# npm ships node-pty's spawn-helper without the executable bit.
afterPack: build/after-pack.cjs
# Lock down the packaged binary so it can't be reused to run arbitrary code
# (and decrypt saved passwords) via ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon-win.png
  # x64 only: Windows on ARM runs it through emulation, and a dual-arch installer is twice the size.
  target:
    - target: nsis
      arch: [x64]

# A classic setup wizard: pick a folder, get Start menu and desktop shortcuts,
# an uninstaller in "Installed apps", and an option to launch Liman at the end.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Liman
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  # Ad-hoc signature: required for Apple Silicon to run the app at all. Replace with a
  # Developer ID identity (and enable hardenedRuntime + notarization) for public releases.
  identity: "-"
  hardenedRuntime: false
  # node-pty brings both Mac builds; the universal app keeps them as they are.
  x64ArchFiles: "**/node_modules/node-pty/prebuilds/**"
  artifactName: ${productName}-${version}-mac-universal.${ext}

# Drag-to-Applications disk image.
dmg:
  title: ${productName} ${version}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications
