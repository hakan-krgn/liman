appId: com.uxplima.liman
productName: Liman
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
# Lock down the packaged binary so it can't be reused to run arbitrary code
# (and decrypt saved passwords) via ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
  hardenedRuntime: true
